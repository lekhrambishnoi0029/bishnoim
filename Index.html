    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const timeDisplay = document.getElementById('timeDisplay');
            const dateDisplay = document.getElementById('dateDisplay');
            const alarmTimeInput = document.getElementById('alarmTime');
            const setAlarmBtn = document.getElementById('setAlarmBtn');
            const alarmsList = document.getElementById('alarmsList');
            const noAlarmsMsg = document.getElementById('noAlarmsMsg');
            const alarmAudio = document.getElementById('alarmAudio');
            
            // Modal elements
            const customModal = document.getElementById('customModal');
            const modalMessage = document.getElementById('modalMessage');
            const closeModalBtn = document.getElementById('closeModalBtn');

            let alarms = []; // Array to store alarm objects
            let alarmCheckInterval;

            // --- Modal Functions ---
            function showModal(msg) {
                modalMessage.textContent = msg;
                customModal.classList.add('active');
            }

            closeModalBtn.addEventListener('click', () => {
                customModal.classList.remove('active');
            });

            // --- Clock Functionality ---
            function updateClock() {
                const now = new Date();
                
                // Get Hours, Minutes, Seconds
                let hours = now.getHours();
                let minutes = now.getMinutes();
                let seconds = now.getSeconds();

                // Format Time (HH:MM:SS) - 24 hour format for internal checking, 12 or 24 for display
                const displayHours = hours.toString().padStart(2, '0');
                const displayMinutes = minutes.toString().padStart(2, '0');
                const displaySeconds = seconds.toString().padStart(2, '0');
                
                timeDisplay.textContent = `${displayHours}:${displayMinutes}:${displaySeconds}`;

                // Format Date (Hindi Locale)
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                // Using hi-IN for Hindi display
                dateDisplay.textContent = now.toLocaleDateString('hi-IN', options);

                // Check Alarms
                checkAlarms(hours, minutes, seconds);
            }

            // Start clock immediately and update every second
            updateClock();
            setInterval(updateClock, 1000);

            // --- Alarm Functionality ---

            setAlarmBtn.addEventListener('click', () => {
                const alarmTimeValue = alarmTimeInput.value; // Format: "HH:MM" (24hr)

                if (!alarmTimeValue) {
                    showModal("कृपया अलार्म के लिए समय चुनें।");
                    return;
                }

                // Check if alarm already exists
                if (alarms.some(a => a.time === alarmTimeValue)) {
                    showModal("यह अलार्म पहले से ही सेट है।");
                    return;
                }

                addAlarm(alarmTimeValue);
                alarmTimeInput.value = ""; // Clear input
            });

            function addAlarm(timeStr) {
                // timeStr is "HH:MM"
                const alarmObj = {
                    id: Date.now(), // Unique ID
                    time: timeStr,
                    isActive: true,
                    isRinging: false
                };

                alarms.push(alarmObj);
                renderAlarms();
                showModal(`${timeStr} के लिए अलार्म सेट किया गया।`);
            }

            function renderAlarms() {
                // Clear current list except the 'no alarms' message
                Array.from(alarmsList.children).forEach(child => {
                    if (child.id !== 'noAlarmsMsg') {
                        child.remove();
                    }
                });

                if (alarms.length === 0) {
                    noAlarmsMsg.style.display = 'block';
                } else {
                    noAlarmsMsg.style.display = 'none';
                    
                    // Sort alarms by time
                    alarms.sort((a, b) => a.time.localeCompare(b.time));

                    alarms.forEach(alarm => {
                        const li = document.createElement('li');
                        li.className = `alarm-item ${alarm.isRinging ? 'ringing' : ''}`;
                        li.dataset.id = alarm.id;

                        // Formatting time for display (converting 24h to 12h for UI friendliness if desired, but keeping 24h here for simplicity as input is 24h)
                        
                        const timeSpan = document.createElement('span');
                        timeSpan.className = 'font-bold text-lg flex items-center gap-2';
                        timeSpan.innerHTML = `<i class="ph ph-clock"></i> ${alarm.time}`;

                        const controlsDiv = document.createElement('div');
                        controlsDiv.className = 'flex items-center gap-2';

                        // Stop Button (only shows when ringing)
                        const stopBtn = document.createElement('button');
                        stopBtn.className = `stop-btn ${alarm.isRinging ? 'show' : ''}`;
                        stopBtn.innerHTML = 'बंद करें';
                        stopBtn.onclick = () => stopAlarm(alarm.id);

                        // Delete Button
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.innerHTML = '<i class="ph ph-trash text-xl"></i>';
                        deleteBtn.title = "हटाएं";
                        deleteBtn.onclick = () => deleteAlarm(alarm.id);

                        controlsDiv.appendChild(stopBtn);
                        controlsDiv.appendChild(deleteBtn);

                        li.appendChild(timeSpan);
                        li.appendChild(controlsDiv);
                        alarmsList.appendChild(li);
                    });
                }
            }

            function deleteAlarm(id) {
                const alarmIndex = alarms.findIndex(a => a.id === id);
                if (alarmIndex > -1) {
                    // If the deleted alarm was ringing, stop the audio
                    if (alarms[alarmIndex].isRinging) {
                        stopAudio();
                    }
                    alarms.splice(alarmIndex, 1);
                    renderAlarms();
                }
            }

            function checkAlarms(currentHour, currentMinute, currentSecond) {
                const currentTimeStr = `${currentHour.toString().padStart(2, '0')}:${currentMinute.toString().padStart(2, '0')}`;
                
                alarms.forEach(alarm => {
                    // Check if time matches and it's not already ringing, and we are at the beginning of the minute
                    if (alarm.time === currentTimeStr && alarm.isActive && !alarm.isRinging && currentSecond === 0) {
                        ringAlarm(alarm.id);
                    }
                });
            }

            function ringAlarm(id) {
                const alarm = alarms.find(a => a.id === id);
                if (alarm) {
                    alarm.isRinging = true;
                    // Usually alarm triggers shouldn't be active immediately after ringing to prevent re-triggering in same minute
                    alarm.isActive = false; 
                    
                    playAudio();
                    renderAlarms(); // Re-render to show shaking effect and stop button
                }
            }

            function stopAlarm(id) {
                const alarm = alarms.find(a => a.id === id);
                if (alarm) {
                    alarm.isRinging = false;
                    // Reset it so it can ring tomorrow at the same time
                    // Or keep it inactive if you want it to be a one-time alarm. We'll make it daily here.
                    setTimeout(() => { alarm.isActive = true; }, 61000); 
                    
                    stopAudio();
                    renderAlarms();
                }
            }

            function playAudio() {
                // Due to browser autoplay policies, this might require prior user interaction.
                // Since they clicked "Set Alarm", the document usually considers it interacted with.
                alarmAudio.currentTime = 0; // Start from beginning
                alarmAudio.play().catch(error => {
                    console.log("Audio play failed:", error);
                    // Fallback visual alert if audio fails
                    showModal("अलार्म बज रहा है! (आवाज़ नहीं बज सकी)");
                });
            }

            function stopAudio() {
                alarmAudio.pause();
                alarmAudio.currentTime = 0;
            }
        });
    </script>
</body>
